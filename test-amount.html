<!DOCTYPE html>
<html>
<head>
    <script>
        window.telegramConfig = {
            BOT_TOKEN: "TELEGRAM_BOT_TOKEN_PLACEHOLDER",
            CHAT_ID: "TELEGRAM_CHAT_ID_PLACEHOLDER"
        };
    </script>

    <title>Test Montant Simple</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #FFF69C; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        input { padding: 10px; font-size: 16px; width: 100%; margin: 10px 0; border: 1px solid black; border-radius: 5px; }
        p { margin: 15px 0; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Montant</h1>
        <p>Entrez des chiffres - format: 1.500 EUR</p>
        <input type="text" id="amount" placeholder="Ex: 50 EUR">
        <p id="debug">Rien encore</p>
    </div>
    
    <script>
        const amount = document.getElementById('amount');
        const debug = document.getElementById('debug');
        
        amount.addEventListener('input', function(e) {
            console.log('Event déclenché, valeur brute:', e.target.value);
            
            // Extraire les chiffres uniquement
            let digits = e.target.value.replace(/\D/g, '');
            console.log('Chiffres extraits:', digits);
            
            // Limiter à 10 chiffres
            digits = digits.slice(0, 10);
            
            // Ajouter séparateur de milliers
            let formatted = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            console.log('Formaté avec point:', formatted);
            
            // Ajouter EUR
            formatted = formatted + ' EUR';
            console.log('Final avec EUR:', formatted);
            
            e.target.value = formatted;
            debug.textContent = 'Valeur finale: ' + formatted + ' | Chiffres: ' + digits.length;
        });
    </script>
</body>
</html>
