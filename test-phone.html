<!DOCTYPE html>
<html>
<head>
    <script>
        window.telegramConfig = {
            BOT_TOKEN: "TELEGRAM_BOT_TOKEN_PLACEHOLDER",
            CHAT_ID: "TELEGRAM_CHAT_ID_PLACEHOLDER"
        };
    </script>

    <title>Test Format Téléphone</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { padding: 10px; font-size: 16px; width: 300px; }
        p { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Test Format Téléphone</h1>
    <p>Entrez 10 chiffres, le format appliqué sera: 00 00 00 00 00</p>
    <input type="tel" id="phone" placeholder="00 00 00 00 00">
    
    <script>
        const phone = document.getElementById('phone');
        
        phone.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
            let formatted = '';
            
            if (value.length > 0) {
                if (value.length <= 2) {
                    formatted = value;
                } else if (value.length <= 4) {
                    formatted = value.slice(0, 2) + ' ' + value.slice(2, 4);
                } else if (value.length <= 6) {
                    formatted = value.slice(0, 2) + ' ' + value.slice(2, 4) + ' ' + value.slice(4, 6);
                } else if (value.length <= 8) {
                    formatted = value.slice(0, 2) + ' ' + value.slice(2, 4) + ' ' + value.slice(4, 6) + ' ' + value.slice(6, 8);
                } else if (value.length <= 10) {
                    formatted = value.slice(0, 2) + ' ' + value.slice(2, 4) + ' ' + value.slice(4, 6) + ' ' + value.slice(6, 8) + ' ' + value.slice(8, 10);
                }
            }
            
            e.target.value = formatted;
            console.log('Valeur formatée:', formatted);
        });
    </script>
</body>
</html>
